[project]
name = "codetest-agent"
version = "0.1.0"
description = "Code Test AI Agent - Agent (LLM 판단 전담, 코드 기반 처리는 MCP 에 위임)"
requires-python = ">=3.10"

dependencies = [
    # --- REST API (Local Client 수신) ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # --- MCP 서비스 호출 (FastAPI 로 송/수신) ---
    "httpx>=0.27",

    # --- LLM ---
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # fastapi TestClient
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
