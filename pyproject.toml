[project]
name = "codetest-agent-server"
version = "0.1.0"
description = "Code Test AI Agent - Agent Server (별도 관리 서버 배포용)"
requires-python = ">=3.10"

dependencies = [
    # --- REST API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # --- DB (Project, Graph Node/Edge, Workflow) ---
    "SQLAlchemy>=2.0",

    # --- 저장소 clone ---
    "GitPython>=3.1",

    # --- LLM ---
    "anthropic>=0.40",

    # --- AST 파싱 (LLM 토큰 미소모) ---
    "tree-sitter>=0.22",
    "tree-sitter-language-pack>=0.2",  # Java/JS/TS/Python/XML/SQL 문법 번들
    "lxml>=5.2",                       # MyBatis XML 파싱
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # fastapi TestClient
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
